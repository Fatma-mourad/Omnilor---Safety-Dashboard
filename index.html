<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--navy:#0b1b3b;--mut:#536078;--blue:#0073ff;--bg:#f5f7fb;--line:#d5dcea;--grn:#12a967;--org:#f5a524;--red:#e53935;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--navy)}
*{box-sizing:border-box}
.scr{position:absolute;left:0;top:0;display:none;transform-origin:0 0;background:var(--bg);overflow:hidden}
.scr.on{display:block}
.a{position:absolute}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;gap:10px;border:2px solid var(--line);background:#fff;border-radius:8px;font:600 25px 'IBM Plex Sans';color:var(--navy);cursor:pointer;white-space:nowrap}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 14px rgba(0,115,255,.25)}
.btn.dis{background:#dde4f0;border-color:#dde4f0;color:#fff;cursor:default;box-shadow:none}
.card{position:absolute;background:#fff;border:2px solid #e3e8f2;border-radius:14px}
.sh{box-shadow:0 8px 28px rgba(20,40,90,.14);border:0}
.t{position:absolute;white-space:nowrap}
.b{font-weight:700}.m{color:var(--mut)}.g{color:var(--grn)}.bl{color:var(--blue)}
.nav{position:absolute;left:0;width:340px;height:60px;color:#fff;font:500 25px 'IBM Plex Sans';cursor:pointer}
.nav svg{position:absolute;left:38px;top:16px}.nav span{position:absolute;left:76px;top:14px}
.zl{transform-origin:50% 100%;position:absolute;border-radius:12px;background:rgba(255,255,255,.55);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.7);padding:12px 12px;cursor:pointer;transform:translate(-50%,-100%);z-index:3;transition:border-color .15s}
.zl b{display:block;font:600 22px 'IBM Plex Sans';margin-bottom:10px;white-space:nowrap}
.zl i{font:700 22px 'IBM Plex Sans';font-style:normal;background:var(--blue);color:#fff;border-radius:6px;padding:5px 10px;display:inline-block}
.zl.sel{border:4px solid var(--blue);background:rgba(255,255,255,.7)}
.zl:hover{border-color:var(--blue)}
.mb{position:absolute;background:#fff;border-radius:10px;box-shadow:0 4px 14px rgba(20,40,90,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:4}
.mk{position:absolute;transform:translate(-50%,-50%) scale(calc(1/var(--k,1)));z-index:3}
.mk .tag{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);color:#fff;font:600 21px 'IBM Plex Sans';padding:4px 16px;border-radius:20px;white-space:nowrap}
.mk .ring{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.lay{position:absolute;left:18px;height:44px;font:600 26px 'IBM Plex Sans';cursor:pointer;display:flex;align-items:center;gap:14px;width:310px}
.lay u{width:28px;height:28px;border-radius:6px;display:block}
.lay.off{opacity:.35}
.dd{position:absolute;background:#fff;border:2px solid var(--line);border-radius:10px;box-shadow:0 10px 24px rgba(20,40,90,.2);z-index:9;display:none;overflow:hidden}
.dd div{padding:14px 20px;font:500 22px 'IBM Plex Sans';cursor:pointer;white-space:nowrap}.dd div:hover{background:#eef3ff}
.lh{height:55px;display:flex;align-items:center;gap:14px;padding:0 20px 0 18px;font:600 26px 'IBM Plex Sans';cursor:pointer;user-select:none}
.lh u{width:28px;height:28px;border-radius:6px;display:block;flex:none}.lh .chev{margin-left:auto;line-height:0;transition:transform .15s}
.ly.open .chev{transform:rotate(90deg)}.ls{padding:2px 12px 12px 18px}
.si{height:44px;display:flex;align-items:center;gap:12px;padding:0 16px 0 12px;border-left:3px solid #0073ff;background:#dfeaff;color:#0073ff;font:600 23px 'IBM Plex Sans';cursor:pointer;user-select:none}
.si .ck{line-height:0}.si em{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#0073ff}
.si.off{background:#f1f4f9;color:#8793ab;border-left-color:#c5cfe0}.si.off .ck{visibility:hidden}.si.off em{background:#c5cfe0}
.em{font:500 21px 'IBM Plex Sans';color:#8793ab;padding:8px 12px}
[class*=tip]:hover::after{opacity:1}
.tipR::after,.tipL::after,.tipB::after{content:attr(data-tip);position:absolute;background:#0b1b3b;color:#fff;font:500 20px 'IBM Plex Sans';padding:8px 14px;border-radius:8px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:30;line-height:1.2}
.tipR::after{left:calc(100% + 12px);top:50%;transform:translateY(-50%)}.tipL::after{right:calc(100% + 12px);top:50%;transform:translateY(-50%)}.tipB::after{top:calc(100% + 10px);left:50%;transform:translateX(-50%)}
.rl:hover{background:#eef3ff}
.zl.gt i{background:#12a967}#eo{position:absolute;left:0;top:0;width:2419px;height:1512px;pointer-events:none;z-index:9;display:none}#eo>*{pointer-events:auto}.zl.gt.bad i{background:#e53935}
#dash .row{position:absolute;left:0;right:0}
.sb{position:absolute;left:0;top:0;width:340px;height:100%;background:#001f3f;z-index:6;color:#fff}
.sb img{position:absolute;left:24px;top:30px;width:241px}
.sbi{position:absolute;left:21px;width:300px;height:75px;border-radius:8px;display:flex;align-items:center;gap:20px;padding-left:24px;font:500 26px 'IBM Plex Sans';cursor:pointer;transition:background .15s}
.sbi:hover{background:rgba(255,255,255,.09)}.sbi.act{background:var(--blue);font-weight:600}
.bdg{margin-left:auto;margin-right:34px;background:var(--blue);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font:600 24px 'IBM Plex Sans'}
.ovl{position:absolute;inset:0;background:rgba(11,27,59,.55);z-index:60;display:flex;align-items:center;justify-content:center}
.mdl{width:780px;background:#fff;border-radius:18px;padding:44px 48px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mdl h2{margin:0 0 12px;font:700 36px 'IBM Plex Sans'}.mdl p{margin:0 0 22px;color:var(--mut);font-size:23px;line-height:1.4}
.mdl textarea{width:100%;height:170px;border:2px solid var(--line);border-radius:10px;padding:16px;font:500 24px 'IBM Plex Sans';resize:none;color:var(--navy);outline:0}
.mdl textarea:focus{border-color:var(--blue)}
.chip{display:inline-block;margin:0 10px 10px 0;padding:8px 16px;border:2px solid #cfe0ff;background:#eef4ff;color:var(--blue);border-radius:20px;font:600 20px 'IBM Plex Sans';cursor:pointer}
.mf{display:flex;justify-content:flex-end;gap:18px;margin-top:26px}
.mbt{padding:16px 34px;border-radius:10px;border:2px solid var(--line);font:600 24px 'IBM Plex Sans';cursor:pointer}
.mbt.p{background:var(--blue);color:#fff;border-color:var(--blue)}.mbt.r{background:var(--red);color:#fff;border-color:var(--red)}
.tst{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);background:var(--navy);color:#fff;font:500 24px 'IBM Plex Sans';padding:16px 30px;border-radius:12px;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.3)}
@keyframes pg{0%{box-shadow:0 0 0 0 rgba(229,57,53,.55)}70%,100%{box-shadow:0 0 0 30px rgba(229,57,53,0)}}
.fire{position:absolute;width:68px;height:68px;border-radius:50%;background:var(--red);border:4px solid #ff9c98;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;z-index:4;animation:pg 1.6s infinite}
.zl.hot{background:rgba(229,57,53,.78);border-color:#ff8a86;color:#fff}.zl.hot i{background:var(--red);border:2px solid #ff9c98}
.ping{position:absolute;transform:translate(-50%,-50%);z-index:4}
.ping i{display:block;width:34px;height:34px;border-radius:50%;background:var(--red);border:4px solid #fff;animation:pg 1.2s infinite}
.ping b{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);background:var(--navy);color:#fff;font:600 20px 'IBM Plex Sans';padding:4px 12px;border-radius:14px;white-space:nowrap}
.eb{position:absolute;left:28px;width:291px;height:58px;border-radius:8px;border:2px solid;background:#fff;display:flex;align-items:center;justify-content:center;font:600 22px 'IBM Plex Sans';cursor:pointer;transition:background .15s,color .15s}
.pnl{position:absolute;left:1927px;width:472px;border-radius:14px;z-index:5;box-shadow:0 8px 28px rgba(20,40,90,.14)}
.pill{position:absolute;left:28px;top:28px;height:38px;border-radius:19px;color:#fff;font:600 22px 'IBM Plex Sans';display:flex;align-items:center;justify-content:center;padding:0 22px}
.pl{position:absolute;left:22px;top:108px;width:428px;background:#fff;border:2px solid #e3e8f2;border-radius:12px;overflow:hidden}
.pl .hr,.pl .rw{display:grid;grid-template-columns:150px 140px 1fr;padding:0 22px;align-items:center;font:500 21px 'IBM Plex Sans'}
.pl .hr{height:56px;color:var(--mut);font-weight:600;font-size:19px;border-bottom:2px solid #e3e8f2}
.pl .rw{height:56px;cursor:pointer}.pl .rw:nth-child(odd){background:#f4f6fb}.pl .rw:hover,.pl .rw.sel{background:#e5efff}
.pl .sc2{overflow-y:auto}
.sc{position:absolute;top:172px;width:372px;height:128px;background:#fff;border:2px solid #e3e8f2;border-radius:14px;display:flex;align-items:center;gap:18px;padding:0 22px;cursor:pointer;box-shadow:0 4px 16px rgba(20,40,90,.07);transition:.15s}
.sc:hover{border-color:#9cc3ff}.sc.on{border:3px solid var(--blue);background:#f2f7ff}
.sc .ci{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.sc b{display:block;font:700 40px 'IBM Plex Sans';line-height:1}.sc span{font:500 20px 'IBM Plex Sans';color:var(--mut)}
.tb{position:absolute;top:330px;height:68px;display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:0 18px;font:500 22px 'IBM Plex Sans'}
.tb input,.tb select{border:0;outline:0;background:transparent;font:500 22px 'IBM Plex Sans';color:var(--navy);width:100%;height:100%;cursor:pointer}
.tb input{cursor:text}
.pt{position:absolute;left:400px;top:430px;width:1390px;height:990px;background:#fff;border:2px solid #e3e8f2;border-radius:14px;box-shadow:0 8px 28px rgba(20,40,90,.1);overflow:hidden}
.pt .g{display:grid;grid-template-columns:2fr 1.2fr 1.3fr 1.6fr 1.2fr .9fr;align-items:center;padding:0 30px;gap:10px;font:500 22px 'IBM Plex Sans'}
.pt .th{height:68px;border-bottom:2px solid #e3e8f2;color:var(--mut);font-weight:600;font-size:20px;background:#fafbfe}
.pt .th div{cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none}.pt .th div:hover,.pt .th .s{color:var(--blue)}
.pt .tr{height:78px;cursor:pointer;border-bottom:1px solid #edf0f7;border-left:5px solid transparent}
.pt .tr:hover{background:#f4f8ff}.pt .tr.sel{background:#e9f1ff;border-left-color:var(--blue)}
.av{width:48px;height:48px;border-radius:50%;color:#fff;font:600 20px 'IBM Plex Sans';display:flex;align-items:center;justify-content:center;flex:none;object-fit:cover}
.st{display:inline-flex;align-items:center;gap:9px;padding:6px 16px;border-radius:20px;font:600 20px 'IBM Plex Sans'}.st u{width:10px;height:10px;border-radius:50%;background:currentColor}
.ctr{font:600 15px 'IBM Plex Sans';background:#ece4ff;color:#6a1df5;border-radius:5px;padding:2px 7px;margin-left:10px}
.pf{position:absolute;left:0;right:0;bottom:0;height:84px;border-top:2px solid #e3e8f2;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font:500 21px 'IBM Plex Sans';color:var(--mut);background:#fff}
.pg{display:flex;gap:8px}.pg div{min-width:48px;height:48px;border:2px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--navy);font-weight:600}
.pg .on{background:var(--blue);border-color:var(--blue);color:#fff}.pg .dz{opacity:.35;cursor:default}
.dt{position:absolute;left:1822px;width:537px;background:#fff;border:2px solid #e3e8f2;border-radius:14px;box-shadow:0 8px 28px rgba(20,40,90,.1)}
.fl{display:flex;gap:10px;font:500 23px 'IBM Plex Sans';margin-bottom:17px}.fl b{color:var(--blue);font-weight:700;white-space:nowrap}
.empty{padding:90px 0;text-align:center;color:var(--mut);font:500 24px 'IBM Plex Sans'}
